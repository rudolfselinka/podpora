<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technická podpora - VDF Games</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            color: #111;
            background-color: #ffffff;
        }
 
        .container {
            max-width: 800px;
        }
 
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
 
        .subtitle {
            font-size: 15px;
            margin-bottom: 25px;
            color: #333;
        }
 
        .form-group {
            margin-bottom: 20px;
        }
 
        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }
 
        textarea {
            width: 100%;
            height: 100px;
            padding: 8px;
            border: 1px solid #767676;
            border-radius: 2px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }
 
        input[type="email"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #767676;
            border-radius: 2px;
            font-size: 14px;
            box-sizing: border-box;
        }
 
        .btn-submit {
            background-color: #e0e0e0;
            border: 1px solid #767676;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 2px;
        }
 
        .btn-submit:hover {
            background-color: #d0d0d0;
        }
 
        .response-section {
            margin-top: 35px;
        }
 
        .response-section h2 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
 
        .response-box {
            width: 100%;
            height: 80px;
            border: 1px solid #767676;
            padding: 10px;
            box-sizing: border-box;
            background-color: #fff;
            color: #333;
            font-size: 14px;
        }
    </style>
</head>
<body>
 
    <div class="container">
        <h1>Technická podpora – VDF Games</h1>
        <p class="subtitle">Jak ti můžeme pomoct? Napiš, jaký máš problém.</p>
 
        <form action="#" method="POST">
            <div class="form-group">
                <label for="dotaz">Tvůj dotaz:</label>
                <textarea id="dotaz" name="dotaz" placeholder="Např.: Při načítání přihlašování se mi hra vynechá..."></textarea>
            </div>
 
            <div class="form-group">
                <label for="email">E-mail (nepovinný):</label>
                <input type="email" id="email" name="email" value="tvoj@email.cz">
            </div>
 
            <button type="submit" class="btn-submit">Odeslat dotaz</button>
        </form>
 
        <div class="response-section">
            <h2>Odpověď podpory:</h2>
            <div class="response-box">
                Zatím žádný dotaz
            </div>
        </div>
    </div>
 
</body>
</html>
